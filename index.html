<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário de Inscrição</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">

        <h1>Inscrição para Evento</h1>

        <p class="descricao">
            Preencha todos os campos abaixo para realizar sua inscrição.
        </p>

        <form id="formulario">

            <h2>Dados pessoais</h2>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" placeholder="Digite seu nome">

            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento">

            <label for="idade">Idade:</label>
            <input type="number" id="idade" placeholder="Digite sua idade">

            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="exemplo@email.com">

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" placeholder="(11) 99999-9999">

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="000.000.000-00">

            <h2>Endereço</h2>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" placeholder="Digite sua cidade">

            <label for="estado">Estado:</label>
            <select id="estado">
                <option value="">Selecione seu estado</option>
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="MG">Minas Gerais</option>
                <option value="PR">Paraná</option>
                <option value="SC">Santa Catarina</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="Outro">Outro</option>
            </select>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" placeholder="00000-000">

            <h2>Informações do evento</h2>

            <label for="evento">Qual evento deseja participar?</label>
            <select id="evento">
                <option value="">Selecione uma opção</option>
                <option value="Tecnologia">Feira de Tecnologia</option>
                <option value="Programação">Workshop de Programação</option>
                <option value="Empreendedorismo">Palestra de Empreendedorismo</option>
                <option value="Inovação">Encontro de Inovação</option>
            </select>

            <label for="periodo">Período de participação:</label>
            <select id="periodo">
                <option value="">Selecione o período</option>
                <option value="Manhã">Manhã</option>
                <option value="Tarde">Tarde</option>
                <option value="Noite">Noite</option>
            </select>

            <label for="experiencia">Você já participou de eventos semelhantes?</label>
            <select id="experiencia">
                <option value="">Selecione uma opção</option>
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
            </select>

            <label for="instituicao">Escola ou instituição:</label>
            <input type="text" id="instituicao" placeholder="Digite o nome da instituição">

            <label for="motivacao">Por que deseja participar?</label>
            <textarea id="motivacao" rows="4"
                placeholder="Conte um pouco sobre sua motivação..."></textarea>

            <h2>Contato de emergência</h2>

            <label for="responsavel">Nome do responsável:</label>
            <input type="text" id="responsavel" placeholder="Nome completo">

            <label for="telefoneResponsavel">Telefone do responsável:</label>
            <input type="tel" id="telefoneResponsavel" placeholder="(11) 99999-9999">

            <div class="termos">
                <input type="checkbox" id="termos">
                <label for="termos">
                    Confirmo que as informações preenchidas são verdadeiras.
                </label>
            </div>

            <button type="submit">Enviar inscrição</button>

        </form>

        <p id="mensagem"></p>

        <div class="resultado-container">
            <h2>Dados cadastrados</h2>
            <pre id="resultado"></pre>
        </div>

    </div>

</body>
</html>
